# Compila el sitio estático y lo publica por FTP en el subdominio de Hostinger.
# Se ejecuta con cada push a main (o a mano desde la pestaña Actions).
# Requiere los secretos FTP_SERVER, FTP_USERNAME, FTP_PASSWORD y FTP_DIR (ver README).
# Sin FTP_SERVER solo compila y omite la subida (útil mientras el sitio vive en Vercel).
name: Publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Subir out/ por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_DIR }}
